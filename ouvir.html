<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#08090b">
<title>Ouvir os sobrenomes · Cartório de Restauração Identitária</title>
<style>
:root{--bg:#08090b;--ink:#fff;--soft:#9a9ea7;--line:#2a2d33;--chip:#121418}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:28px 16px 40px}
header{display:flex;align-items:center;gap:12px;padding-bottom:20px;border-bottom:1px solid var(--line)}
header img{width:42px;height:auto;filter:brightness(0) invert(1)}
header strong{display:block;font-size:17px;font-weight:600;line-height:1.2}
header small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
h1{font-family:inherit;font-size:15px;font-weight:400;line-height:1.4;color:var(--soft);margin:22px 0 14px}
.all{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.all[hidden]{display:none}
.all button{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border:0;border-radius:25px;background:#fff;color:var(--bg);font:600 15px/1 inherit;font-family:inherit;cursor:pointer}
.all svg{width:16px;height:16px}
.all-label{grid-column:1/-1;font-size:12px;color:var(--soft);margin:0 0 -2px}
ol{list-style:none;margin:18px 0 0;padding:0}
li{padding:16px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;transition:border-color .2s,background .2s}
li.here{border-color:#6b6f78;background:var(--chip)}
li.playing{border-color:#fff}
.name{font:500 26px/1.2 Baskerville,"Times New Roman",serif;margin:0 0 4px;word-break:break-word}
.meaning{font-size:14px;color:#c8cbd1;margin:0}
.origin{font-size:12px;color:var(--soft);margin:2px 0 0}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px 0 0;font-size:12px;color:var(--soft)}
.row span{min-width:44px}
.row button,.row a{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border:1px solid #4a4e56;border-radius:16px;background:transparent;color:#fff;font:500 13px/1 inherit;font-family:inherit;text-decoration:none;cursor:pointer}
.row a{color:#c8cbd1;border-color:var(--line);padding:5px 11px;font-size:12px}
.row button.playing{background:#fff;color:var(--bg);border-color:#fff}
.row button:hover,.row a:hover,.row a:focus-visible{border-color:#9a9ea7;color:#fff}
.row button.playing:hover{color:var(--bg)}
.row svg{width:13px;height:13px}
footer{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);font-size:11px;color:var(--soft)}
@media (prefers-reduced-motion:reduce){li{transition:none}}
</style>
</head>
<body>
<main>
<header><img src="sankofa.svg" alt=""><div><strong>Cartório de Restauração Identitária</strong><small>Pronúncia dos sobrenomes</small></div></header>
<h1 id="title">Escolha a voz e toque para ouvir cada sobrenome.</h1>
<div class="all" id="all"><p class="all-label">Ouvir todos em sequência</p><button type="button" data-all="m"></button><button type="button" data-all="h"></button></div>
<ol id="list"></ol>
<footer>Vozes sintéticas geradas a partir do corpus OpenSLR 86 (Google, CC BY-SA 4.0) e dos modelos MMS (Meta). A pronúncia é uma aproximação.</footer>
</main>
<script>
(async function(){
 const playIcon='<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3.5v13l11-6.5z" fill="currentColor"/></svg>';
 const downloadIcon='<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v10M5.5 9 10 13.5 14.5 9M4 16.5h12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
 const VOICES=[['m','Mulher','voz feminina'],['h','Homem','voz masculina']];
 const q=new URLSearchParams(location.search),ids=(q.get('s')||'').split(',').map(s=>s.trim()).filter(Boolean).slice(0,6),here=q.get('d');
 const list=document.getElementById('list'),title=document.getElementById('title'),all=document.getElementById('all');
 let data={};try{data=await (await fetch('sobrenomes.json')).json();}catch(e){}
 const rows=ids.filter(id=>data[id]);
 if(!rows.length){title.textContent='Nenhum sobrenome encontrado neste link.';all.hidden=true;return;}
 if(rows.length===1)all.hidden=true;
 const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 all.querySelectorAll('[data-all]').forEach(b=>{const [,label]=VOICES.find(([v])=>v===b.dataset.all);b.innerHTML=playIcon+label;b.setAttribute('aria-label','Ouvir todos os sobrenomes, '+label.toLowerCase());});
 list.innerHTML=rows.map(id=>{const n=esc(data[id].n);return `<li data-id="${esc(id)}"${id===here?' class="here"':''}><p class="name">${n}</p><p class="meaning">${esc(data[id].m)}</p><p class="origin">${esc(data[id].o)}</p>`+
  `<p class="row"><span>Ouvir:</span>${VOICES.map(([v,label,full])=>`<button type="button" data-voice="${v}" aria-label="Ouvir ${n}, ${full}">${playIcon}${label}</button>`).join('')}</p>`+
  `<p class="row"><span>Baixar:</span>${VOICES.map(([v,label,full])=>`<a href="${v}-${encodeURIComponent(id)}.m4a" download="${n} (${full}).m4a" aria-label="Baixar ${n}, ${full}">${downloadIcon}${label}</a>`).join('')}</p></li>`;}).join('');
 const audio=new Audio();let queue=[],queueVoice='m';
 function mark(id,v){list.querySelectorAll('li').forEach(li=>{const on=li.dataset.id===id;li.classList.toggle('playing',on);li.querySelectorAll('[data-voice]').forEach(b=>b.classList.toggle('playing',on&&b.dataset.voice===v));});}
 function play(id,v){audio.src=`${v}-${encodeURIComponent(id)}.m4a`;mark(id,v);return audio.play().catch(()=>mark(null));}
 audio.onended=()=>{if(queue.length)setTimeout(()=>play(queue.shift(),queueVoice),450);else mark(null);};
 list.addEventListener('click',e=>{const b=e.target.closest('[data-voice]');if(!b)return;queue=[];play(b.closest('li').dataset.id,b.dataset.voice);});
 all.addEventListener('click',e=>{const b=e.target.closest('[data-all]');if(!b)return;queueVoice=b.dataset.all;queue=rows.slice(1);play(rows[0],queueVoice);});
 // tenta tocar (voz de mulher) o sobrenome tocado na certidão; se o celular bloquear, a pessoa escolhe a voz no botão
 if(here&&data[here])play(here,'m');
})();
</script>
</body>
</html>
